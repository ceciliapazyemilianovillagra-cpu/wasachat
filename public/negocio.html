<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="page-title">Reservá tu turno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F5F7FF;
  --card: #FFFFFF;
  --text: #1A2035;
  --muted: #566280;
  --accent: #3D6CED;
  --accent-light: #EEF2FA;
  --border: #DDE4F2;
  --rad: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111827; --card: #1E2A3B; --text: #EEF2FA;
    --muted: #8A9BBF; --accent-light: #1E2A3B; --border: #2A3A52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111827; --card: #1E2A3B; --text: #EEF2FA;
  --muted: #8A9BBF; --accent-light: #1E2A3B; --border: #2A3A52;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  padding: 2rem 1rem;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--rad);
  padding: 2.5rem 2rem;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
}

.logo-wrap {
  margin-bottom: 1.5rem;
}
.logo-img {
  width: 80px;
  height: 80px;
  border-radius: 20px;
  object-fit: cover;
  display: none;
}
.logo-mark {
  width: 72px;
  height: 72px;
  border-radius: 18px;
  background: var(--accent);
  color: #fff;
  font-family: 'Syne', system-ui;
  font-size: 2rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.negocio-nombre {
  font-family: 'Syne', system-ui;
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: .5rem;
  text-wrap: balance;
}
.negocio-desc {
  font-size: .95rem;
  color: var(--muted);
  line-height: 1.55;
  margin-bottom: 2rem;
  text-wrap: balance;
}

.pausado-msg {
  background: #FFF3CD;
  border: 1px solid #F0C040;
  border-radius: 10px;
  padding: 1rem 1.2rem;
  font-size: .9rem;
  color: #7A5C00;
  margin-bottom: 1.5rem;
  display: none;
}

.btn-turno {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .7rem;
  width: 100%;
  padding: 1rem 1.5rem;
  background: #0D6E3A;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', system-ui;
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: background .15s, transform .1s;
}
.btn-turno:hover { background: #0E7A3F; transform: translateY(-1px); }
.btn-turno:active { transform: translateY(0); }
.btn-turno svg { flex-shrink: 0; }

.footer {
  margin-top: 2rem;
  font-size: .78rem;
  color: var(--muted);
}
.footer a { color: var(--accent); text-decoration: none; }

#loading { color: var(--muted); font-size: .9rem; }
#error { color: #C0392B; font-size: .9rem; display: none; }
:root[data-theme="dark"] #error,
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #error { color: #FF6B6B; } }
</style>
</head>
<body>

<div id="loading">Cargando...</div>
<div id="error">No encontramos este negocio.</div>

<div class="card" id="main-card" style="display:none">
  <div class="logo-wrap">
    <img id="logo-img" class="logo-img" alt="Logo">
    <div id="logo-mark" class="logo-mark">W</div>
  </div>
  <div id="negocio-nombre" class="negocio-nombre"></div>
  <div id="negocio-desc" class="negocio-desc"></div>
  <div id="pausado-msg" class="pausado-msg">⏸ Este negocio está temporalmente en pausa. Volvé a intentar más tarde.</div>
  <a id="btn-turno" class="btn-turno" href="#" target="_blank">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    Sacar turno por WhatsApp
  </a>
</div>

<div class="footer">Powered by <a href="/">WASACHAT</a></div>

<script>
const slug = location.pathname.split('/').filter(Boolean).pop() || 'default';

fetch(`/api/negocio-publico?slug=${encodeURIComponent(slug)}`)
  .then(r => r.json())
  .then(data => {
    document.getElementById('loading').style.display = 'none';
    if (!data || data.error) {
      document.getElementById('error').style.display = 'block';
      return;
    }

    document.title = data.nombre + ' — Reservá tu turno';
    document.getElementById('page-title').textContent = data.nombre + ' — Reservá tu turno';
    document.getElementById('negocio-nombre').textContent = data.nombre;
    document.getElementById('negocio-desc').textContent = data.descripcion || '¡Reservá tu turno fácil y rápido!';

    if (data.logo_url) {
      const img = document.getElementById('logo-img');
      img.src = data.logo_url;
      img.style.display = 'block';
      document.getElementById('logo-mark').style.display = 'none';
    } else {
      document.getElementById('logo-mark').textContent = data.nombre.charAt(0).toUpperCase();
    }

    if (data.pausado) {
      document.getElementById('pausado-msg').style.display = 'block';
      document.getElementById('btn-turno').style.pointerEvents = 'none';
      document.getElementById('btn-turno').style.opacity = '.45';
    }

    const msg = encodeURIComponent(`turno:${slug}`);
    document.getElementById('btn-turno').href = `https://wa.me/${data.whatsapp}?text=${msg}`;

    document.getElementById('main-card').style.display = '';
  })
  .catch(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  });
</script>
</body>
</html>
